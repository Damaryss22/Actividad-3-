version: '3.8'

services:
  # 🐰 RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: exam2p-rabbitmq
    ports:
      - "5672:5672"      # Puerto AMQP
      - "15672:15672"    # Puerto Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - exam2p-network

  # 🔧 n8n
  n8n:
    image: n8nio/n8n
    container_name: exam2p-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - exam2p-network

volumes:
  rabbitmq_data:
    driver: local
  n8n_data:
    driver: local

networks:
  exam2p-network:
    driver: bridge
